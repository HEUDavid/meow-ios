name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-core:
    # Build the Rust core framework required for the iOS app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust (stable + iOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Cache cargo registry, git, and build target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/rust/meow-ios-ffi/target
          key: cargo-${{ runner.os }}-${{ hashFiles('core/rust/meow-ios-ffi/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: Build MeowCore.xcframework
        run: scripts/build-rust.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MeowCore.xcframework
          path: MeowCore/Frameworks/MeowCore.xcframework
          if-no-files-found: error

  build-ipa:
    needs: [ build-core ]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ^26.0
      - uses: actions/download-artifact@v4
        with:
          name: MeowCore.xcframework
          path: MeowCore/Frameworks/MeowCore.xcframework

      - name: Generate project
        run: |
          brew install xcodegen
          
          # Inject App Store identifiers and FkAd branding dynamically
          ./.github/workflows/rebrand.sh
          
          # Dynamically remove the strip script to prevent corrupting unsigned Mach-O binaries
          sed -i '' '/postBuildScripts:/,/fi/d' project.yml
          
          xcodegen generate

      - name: Archive project (no signing)
        run: |
          xcodebuild archive \
            -project meow-ios.xcodeproj \
            -scheme meow-ios \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/meow-ios.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -a build/meow-ios.xcarchive/Products/Applications/meow-ios.app build/Payload/
          
          # Ad-hoc sign the app and extensions. Sideloadly's mach-o parser 
          # often throws "Invalid file" if LC_CODE_SIGNATURE is completely missing.
          codesign --force --sign - --timestamp=none build/Payload/meow-ios.app/PlugIns/*.appex || true
          codesign --force --sign - --timestamp=none build/Payload/meow-ios.app
          
          cd build
          zip -qyr meow-ios-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: meow-ios-unsigned.ipa
          path: build/meow-ios-unsigned.ipa
