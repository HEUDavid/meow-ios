name: MVP Development CI

on:
  push:
    branches: [main]
    paths:
      - 'App/Sources/CustomMvp/**'
      - 'App/Sources/Views/ContentView.swift'
  workflow_dispatch:

concurrency:
  group: mvp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint --strict --reporter github-actions-logging
      - name: SwiftFormat (check)
        run: |
          brew install swiftformat
          swiftformat --lint .

  build-core:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust (stable + iOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Cache cargo registry, git, and build target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/rust/meow-ios-ffi/target
          key: cargo-${{ runner.os }}-${{ hashFiles('core/rust/meow-ios-ffi/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: Build MeowCore.xcframework
        run: scripts/build-rust.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MeowCore.xcframework
          path: MeowCore/Frameworks/MeowCore.xcframework
          if-no-files-found: error

  unit-test:
    needs: [build-core]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ^26.0
      - uses: actions/download-artifact@v4
        with:
          name: MeowCore.xcframework
          path: MeowCore/Frameworks/MeowCore.xcframework
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Test meow-ios unit bundle
        run: |
          xcodebuild test \
            -project meow-ios.xcodeproj \
            -scheme meow-ios \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            -only-testing:MeowTests \
            -resultBundlePath build/unit.xcresult \
            -enableCodeCoverage YES \
            | xcbeautify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-xcresult
          path: build/unit.xcresult

  ui-test:
    needs: [build-core]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ^26.0
      - uses: actions/download-artifact@v4
        with:
          name: MeowCore.xcframework
          path: MeowCore/Frameworks/MeowCore.xcframework
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Run UI tests
        run: |
          xcodebuild test \
            -project meow-ios.xcodeproj \
            -scheme meow-ios \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            -only-testing:MeowUITests \
            -resultBundlePath build/ui.xcresult \
            | xcbeautify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-xcresult
          path: build/ui.xcresult
